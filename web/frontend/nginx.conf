server {
    listen 3000;
    root /usr/share/nginx/html;
    index index.html;

    # Scripts and styles change with each deploy. Without a Cache-Control header
    # browsers guess a cache lifetime and can pair a new index.html with old JS,
    # so make them revalidate (a cheap 304 via ETag) on every load.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
